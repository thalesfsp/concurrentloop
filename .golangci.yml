version: "2"
run:
  timeout: 1m
linters:
  default: all
  disable:
    - cyclop
    - depguard
    - err113
    - exhaustive
    - exhaustruct
    - forcetypeassert
    - gochecknoglobals
    - godox
    - interfacebloat
    - ireturn
    - paralleltest
    - tagliatelle
    - testifylint
    - testpackage
    - varnamelen
    - wrapcheck
  settings:
    funlen:
      lines: 150
      statements: 45
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - forbidigo
          - gochecknoinits
          - mnd
        path: cmd/
      - linters:
          - gosec
        path: message/util.go
      - linters:
          - lll
        path: example_test.go
      - linters:
          - nlreturn
          - unparam
        path: internal/http/
      - linters:
          - dupl
          - funlen
          - nlreturn
          - scopelint
          - wsl
        path: _test\.go
      - linters:
          - lll
        path: doc.go
      - linters:
          - nosnakecase
        path: example_test.go
      - linters:
          - nosnakecase
        text: O_WRONLY|O_RDWR|O_CREATE|O_TRUNC|O_APPEND
      - linters:
          - lll
        source: 'json:'
      - linters:
          - gocritic
          - godot
        source: //////
    paths:
      - internal/*
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - internal/*
      - third_party$
      - builtin$
      - examples$
